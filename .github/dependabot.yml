version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commits に揃える (commitlint / semantic-release 互換)
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # peer 依存で連動するパッケージは major も含めて常に1つのPRにまとめる。
      # (別々のPRに分かれると片方だけ上がり npm ci の peer 解決が壊れるため)
      stryker:
        patterns:
          - "@stryker-mutator/*"
      vitest:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
      # 上記以外の開発ツールのマイナー/パッチ更新はまとめて1つのPRに
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
