version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commits に揃える (commitlint / semantic-release 互換)
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # 開発ツールのマイナー更新はまとめて1つのPRに
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
